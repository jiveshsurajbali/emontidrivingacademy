<body>
    <header>
        <a href="index.html"><img id="logo" src="Images/logo.png" alt="EMonti driving academy logo"></a> 
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="packages.html">Packages</a></li>
            <li><a href="clientRegistrationForm.html">Registration</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>
    <main>
        <h1 id="register">Register for Lessons</h1>
        <form id="paymentForm" method="get" action="orderSubmit.html">
            <fieldset class="custInfoSubmitted">
                <legend>Customer Information</legend>
                <table id="custInfoSubmittedTable">
                </table>
            </fieldset>

            <fieldset class="driveInfo">
                <legend>Lesson Information</legend>

                <label for="lessonsReq">Package:</label>
                <select name="lessonsReq" id="lessonsReq" required>
                    <option value="">---Select a Package---</option>
                    <option value="220">Single Lesson - R220.00</option>
                    <option value="2100">10 Lessons + 1 Free - R2100.00</option>
                    <option value="3125">15 Lessons + 1 Free - R3125.00</option>
                    <option value="3950">20 Lessons + 1 Free - R3950.00</option>
                    <option value="4700">25 Lessons + 1 Free - R4700.00</option>
                    <option value="1000">Refresher Course - R1000.00</option>
                </select>

                <label for="studyMaterial">Study material required:</label>
                <input type="checkbox" name="studyMaterial" id="studyMaterial" value="500">

                <div id="quote">
                    <p style="text-decoration: underline;">Service Quote:</p>
                    <p>Package Selected:</p>
                    <p>Study Material:</p>
                    <p>Total Cost:</p>
                </div>
            </fieldset>

            <fieldset class="payInfo">
                <legend>Payment Information</legend>

                <label for="ccName">Name on Credit Card:</label>
                <input type="text" name="ccName" id="ccName" required>

                <label for="ccType">Credit Card Type:</label>
                <select name="ccType" id="ccType" required>
                    <option value="">---Credit Card Type---</option>
                    <option value="masterCard">MasterCard</option>
                    <option value="visa">Visa</option>
                </select>

                <label for="ccNum">Credit Card Number:</label>
                <input type="text" name="ccNum" id="ccNum" required>

                <label for="expMonth">Expiration Date:</label>
                <select id="expMonth" name="expMonth" required>
                <option value="">mm</option>
                <option value="01">01</option>
                <option value="02">02</option>
                <option value="03">03</option>
                <option value="04">04</option>
                <option value="05">05</option>
                <option value="06">06</option>
                <option value="07">07</option>
                <option value="08">08</option>
                <option value="09">09</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
                </select>

                <select id="expYear" name="expYear" required>
                <option value="">yy</option>
                <option value="2022">2022</option>
                <option value="2023">2023</option>
                <option value="2024">2024</option>
                <option value="2025">2025</option>
                <option value="2026">2026</option>
                </select>   

                <label for="cvc">CVC/CVV:</label>
                <input type="text" name="cvc" id="cvc" size="5" required>
            </fieldset>
            <input type="submit" id="submit" value ="Submit" class="btn">
        </form>
    </main>
